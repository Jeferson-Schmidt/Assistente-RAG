version: '3.8'

networks:
  rag_network:
    driver: bridge

services:
  # Container 1: Motor LLM (Ollama) com Aceleração CUDA
  rag_ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    volumes:
      - ./ollama_volumes:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - rag_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Container 2: Banco de Dados Vetorial (ChromaDB)
  rag_chromadb:
    image: chromadb/chroma:0.5.3  # <-- AGORA O SERVIDOR É DA MESMA GERAÇÃO DO PYTHON
    container_name: rag_chromadb
    volumes:
      - ./chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - rag_network
    restart: unless-stopped

  # Container 3: Interface de Usuário
  rag_gradio_app:
    build: ./app
    container_name: rag_gradio_app
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ./app:/app
    environment:
      - OLLAMA_BASE_URL=http://rag_ollama:11434
      - CHROMA_HOST=rag_chromadb
      - CHROMA_PORT=8000
      - GRADIO_SERVER_NAME=0.0.0.0
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_TELEMETRY_IMPL=chromadb.telemetry.dummy.DummyTelemetry
      - ORT_LOGGING_LEVEL=3
    networks:
      - rag_network
    depends_on:
      - rag_ollama
      - rag_chromadb
    restart: unless-stopped